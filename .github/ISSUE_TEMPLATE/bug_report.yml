name: Bug report
description: Report a reproducible OpenShockBot problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include Discord tokens, OpenShock tokens, shocker UUIDs, or private user IDs.
        Report authorization bypasses or unsafe controls privately under SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenShockBot version or commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local Python
        - Docker Compose
        - Other
    validations:
      required: true
